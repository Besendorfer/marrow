[package]
name = "relevant-reviews"
version = "0.1.0"
edition = "2021"

[lib]
name = "relevant_reviews_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri crate is the workspace root so target/ and Cargo.lock stay here
# (keeps the existing build/signing paths intact). The frontend-agnostic logic
# lives in crates/core; the terminal frontend in crates/cli.
[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

# Shared metadata the published crates (marrow, marrow-core) inherit via
# `<field>.workspace = true`. The desktop `relevant-reviews` package keeps its
# own explicit fields and isn't published.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Besendorfer/marrow"
authors = ["Teancum Besendorfer"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
marrow-core = { path = "crates/core" }
