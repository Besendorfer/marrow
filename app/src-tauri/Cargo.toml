[package]
name = "relevant-reviews"
version = "0.1.0"
edition = "2021"

[lib]
name = "relevant_reviews_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Tauri crate is the workspace root so target/ and Cargo.lock stay here
# (keeps the existing build/signing paths intact). The frontend-agnostic logic
# lives in crates/core; the terminal frontend in crates/cli.
[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

# Shared metadata the published crates (marrow, marrow-core) inherit via
# `<field>.workspace = true`. The desktop `relevant-reviews` package keeps its
# own explicit fields and isn't published.
# Pre-release: claims the crates.io names (marrow-core, marrow-cli) without
# burning a stable 0.1.0. Pre-releases aren't selected by `cargo install` or
# `^` deps without an explicit `--version`, so casual users won't get this build.
[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/Besendorfer/marrow"
authors = ["Teancum Besendorfer"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
marrow-core = { path = "crates/core" }

# Read NSApplication.isActive to drive the floating mini-player: macOS delivers
# no webview focus event on app (re)activation (Cmd+Tab / dock), so app-active
# state is the only reliable signal.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
# Convert the floating mini-player into a non-activating NSPanel so dragging /
# resizing it doesn't activate Marrow (which the app-active poll would treat as
# "you're back" and hide it). Cmd+Tab / opening a PR still activate the app.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
